# Single source of truth for publication types. Used by:
#   label          — meta lines and homepage search text
#   schema         — Schema.org @type in publication-page JSON-LD
#   dc             — DC.type metadata value. Zotero's RDF import reads this whenever no
#                    HighWire venue tag pins the item type, so prefer a value it maps firmly
#                    (map, book, interview) over a broader DCMI term it can only guess from.
#   citation_venue — HighWire/Google Scholar meta tag carrying the venue (omit to skip)
book:
  label: Book
  schema: Book
  dc: book
chapter:
  label: Book Chapter
  schema: ScholarlyArticle
  dc: bookPart
  citation_venue: citation_book_title
journal:
  label: Journal Article
  schema: ScholarlyArticle
  dc: article
  citation_venue: citation_journal_title
conference:
  label: Conference Paper
  schema: ScholarlyArticle
  dc: conferencePaper
  citation_venue: citation_conference_title
magazine:
  label: Magazine Article
  schema: Article
  dc: article
  citation_venue: citation_journal_title
interview:
  label: Interview
  schema: Article
  dc: interview
map:
  label: Map
  schema: Map
  dc: map
