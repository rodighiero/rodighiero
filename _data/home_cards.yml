# Event cards on the homepage gallery (see the `layout` skill, reference/cards.md).
#
# Announcement tiles that link out to an external page (a talk, a workshop, an exhibition).
# Each entry takes `label`, `link` (the external URL — required) and optional `date` (ISO,
# rendered as "26 August 2026"), `eyebrow` (defaults to "Event"; the meta line is uppercased
# in CSS, like every other card's), `venue` (the host institution alone — the city belongs in
# the text if it matters), `sublabel` and `author` (everyone presenting, Dario included, in a
# publication's " and "-joined format: it renders as the same "with X and Y" byline, in the
# same bottom slot, that a publication card ends on). They lead the gallery flow, and are the
# one special card that survives on mobile. Delete an entry once it has happened — nothing
# expires it automatically.
#
# The gallery's other special tiles — the network card and the seven research-cluster filters —
# are not configured here: they are generated from the similarity graph and rendered by
# _layouts/home.html. See scripts/build-network.py and the `network` skill.

events:
  - label: "VISAP 2026: Amplification"
    date: 2026-11-11
    eyebrow: "Exhibition"
    venue: "IEEE Visualization and Visual Analytics"
    sublabel: "The arts program opens its exhibition at the Met Warehouse, MIT, in Boston, asking what it means to turn up the signal on the data, the stories and the communities the world tends not to hear."
    author: "Dario Rodighiero and Sarah Williams and Weidi Zhang"
    link: "https://visap.net/2026/"

  - label: "Aldo Rossi: Darling Architecture"
    date: 2026-09-19
    eyebrow: "Exhibition"
    venue: "Bonnefanten"
    sublabel: "The second edition of The Analogous City map is free to take at the museum’s permanent tribute to the architect who designed it, in Maastricht."
    link: "https://www.bonnefanten.nl/en/exhibitions/aldo-rossi-darling-architecture"
