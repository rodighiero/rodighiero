# Special cards on the homepage gallery (see the `layout` skill, reference/cards.md).
#
# `actions` — clickable tiles embedded in the gallery. Each `action` is either
#           `view:<gallery|list|network>` (switches view) or
#           `type:<publication-type>` (filters the gallery to that front-matter
#           `type`, e.g. map / book / chapter / journal / conference / magazine /
#           interview). An empty list renders no action cards. An optional
#           `pin: first` renders an action as the leading gallery tile (before the
#           forthcoming works); unpinned actions render at the top. Example tile:
#
#   actions:
#     - label: Maps
#       sublabel: Cartographic pieces
#       action: type:map

actions: []
  # The research-cluster filter cards are now generated automatically from the network
  # graph (see scripts/build-network.py → network.json `clusters`, rendered in
  # _layouts/home.html); they are no longer listed here.
  #
  # Manual action cards can still be added: each `action` is `view:<gallery|list|network>`,
  # `type:<publication-type>`, or `search:<terms>`; an optional `pin: first` renders it as
  # the leading gallery tile. Example (a network-view lead card):
  #   - year: now
  #     eyebrow: Filter
  #     venue: Publication network
  #     label: Explore how the works are organized by research area
  #     action: view:network
  #     pin: first
