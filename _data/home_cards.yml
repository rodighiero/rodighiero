  # graph (see scripts/build-network.py → network.json `clusters`, rendered in
  # _layouts/home.html); they are no longer listed here.
  #
  # Manual action cards can still be added: each `action` is `view:<gallery|network>`,
  # `type:<publication-type>`, or `search:<terms>`; an optional `pin: first` renders it as
  # the leading gallery tile. Example (a network-view lead card):
