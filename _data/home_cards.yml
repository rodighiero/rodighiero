# Special cards on the homepage gallery (see the "Special cards" section in CLAUDE.md).
#
# `news`  — a single pinned announcement card. Omit the block (or leave `text`
#           empty) to render no news card.
# `actions` — clickable tiles embedded in the gallery. Each `action` is either
#           `view:<gallery|list|network>` (switches view) or
#           `type:<publication-type>` (filters the gallery to that front-matter
#           `type`, e.g. map / book / chapter / journal / conference / magazine /
#           interview). An empty list renders no action cards. An optional
#           `pin: featured` on an action renders it directly beneath the featured
#           publication, pinned to the same (rightmost) gallery column, instead of
#           at the top of the gallery. Unpinned actions render at the top.
#
# The news card is disabled — the homepage shows the featured book plus one
# pinned action card that enters the network view. To add a news card, fill in
# `news.text`; add more tiles under `actions`, e.g.:
#
#   news:
#     eyebrow: News
#     date: 2026-07-01
#     text: "Short announcement text."
#     link: /publications/some-slug/
#     link_text: Read more
#
#   actions:
#     - label: Maps
#       sublabel: Cartographic pieces
#       action: type:map

news:

actions:
  - eyebrow: Visualization
    venue: Publication network
    label: Explore how the works are organized by research area and how their concepts overlap
    action: view:network
    pin: featured
