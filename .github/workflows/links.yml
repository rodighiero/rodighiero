name: Check links

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          jobSummary: false
          args: >-
            --no-progress
            --accept 200,202,206,302,403,429,999
            --max-retries 2
            --timeout 30
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --exclude-path _site/assets
            --exclude '^/$'
            --exclude 'linkedin\.com'
            --exclude 'fu-berlin\.de'
            --exclude 'cyber\.harvard\.edu'
            --exclude 'doi\.org'
            --exclude 'washingtonpost\.com'
            --exclude 'mckinsey\.com'
            --exclude '4open\.science'
            --exclude 'gsapp\.org'
            --exclude 'sitehost\.iu\.edu'
            --exclude 'dhii\.asia'
            --exclude 'kclpure\.kcl\.ac\.uk'
            --exclude 'peirce\.iupui\.edu'
            --exclude 'hollisarchives\.lib\.harvard\.edu'
            --exclude 'krisis\.eu'
            --exclude 'artefaktum\.hu'
            --exclude 'assembla\.com'
            --exclude 'twitter\.com'
            --exclude 'insights\.dice\.com'
            --exclude 'schemas\.bs8723\.org'
            --exclude 'cs\.vu\.nl'
            --exclude 'macs\.vub\.ac\.be'
            --exclude 'edigeo-online\.it'
            --exclude 'innovazionepa\.gov\.it'
            --exclude 'bcr\.puglia\.it'
            './_site/*.html'
          fail: false
      - name: Annotate broken links with source context
        if: steps.lychee.outputs.exit_code != 0
        run: python3 scripts/link-context.py lychee/out.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
