title: Dario Rodighiero
excerpt_separator: "<!--more-->"
description: Design, Data, and Humanities
url: https://dariorodighiero.com
goatcounter_code: fumoseaffabulazioni

# The author's ORCID, as a resolvable URI. It is the site's one stable identifier for a
# person, and it does structural work rather than decorative: the same string is the JSON-LD
# `@id` on the homepage's Person node and on every publication page's author node, and that
# identity is the only thing telling a consumer the subject of the homepage and the author of
# the sixty-odd publications are one entity. It used to be typed out in six places across two
# files, kept in step by a sentence in the `seo` skill. See that skill's reference/jsonld.md.
orcid: https://orcid.org/0000-0002-1405-7062

plugins:
  - jekyll-feed

# Build-time tooling is not site content. Jekyll copies every folder it isn't told to
# skip, so without this the whole scripts/ chain — and the 280KB of d3 it vendors for
# the offline graph layout — lands in each deploy, where nothing links to it. Setting
# `exclude` replaces Jekyll's own default list instead of adding to it, so the defaults
# worth keeping (Gemfile and friends) are repeated here rather than inherited.
exclude:
  - CLAUDE.md
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

feed:
  posts_limit: 1000
  excerpt_only: true          # feed carries each publication's abstract (excerpt) only, not the full body
  path: /feed/posts.xml       # jekyll-feed always emits a posts feed; park it here (empty), deleted in deploy.yml
  collections:
    publications:
      path: /feed.xml         # the real feed at the conventional location

collections:
  publications:
    output: true
    permalink: /:name

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
