title: Dario Rodighiero
excerpt_separator: "<!--more-->"
description: Design, Data, and Humanities
url: https://dariorodighiero.com
goatcounter_code: fumoseaffabulazioni

plugins:
  - jekyll-feed

feed:
  posts_limit: 1000
  path: /feed/posts.xml       # jekyll-feed always emits a posts feed; park it here (empty), deleted in deploy.yml
  collections:
    publications:
      path: /feed.xml         # the real feed at the conventional location

collections:
  publications:
    output: true
    permalink: /:name

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
