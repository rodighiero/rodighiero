<script>
  // Mode toggle
  (function() {
    var html = document.documentElement;
    document.querySelector('.mode-toggle').addEventListener('click', function() {
      var isDark = html.classList.contains('dark') ||
        (!html.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      html.classList.remove('dark', 'light');
      var next = isDark ? 'light' : 'dark';
      html.classList.add(next);
      try { localStorage.setItem('colorScheme', next); } catch (e) {}
    });
  })();

  // Copy button: formatted citation
  (function() {
    var liveMsg = document.getElementById('live-msg');
    function wire(selector, sourceClass, doneMsg) {
      document.querySelectorAll(selector).forEach(function(btn) {
        var label = btn.textContent;
        btn.addEventListener('click', function() {
          var scope = btn.closest('.card-meta') || btn.closest('article') || document;
          var data = scope.querySelector('.' + sourceClass);
          if (!data) return;
          navigator.clipboard.writeText(data.textContent.trim()).then(function() {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            if (liveMsg) liveMsg.textContent = doneMsg;
            setTimeout(function() {
              btn.textContent = label;
              btn.classList.remove('copied');
              if (liveMsg) liveMsg.textContent = '';
            }, 1500);
          });
        });
      });
    }
    wire('.cite-ref-btn', 'citation-data', 'Citation copied to clipboard.');
  })();

  // Print buttons
  document.querySelectorAll('.print-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { window.print(); });
  });
</script>
