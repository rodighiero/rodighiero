<script>
  /* Promote whatever is still lazy inside `root` to eager. Both layouts want this, for
     different reasons — the homepage warms thumbnails so a filtered-in card travels with
     its picture, the publication page fetches figures before printing — so the rule for
     what counts as warmable lives here once rather than in each of them. */
  function promoteLazyImages(root) {
    (root || document).querySelectorAll('img[loading="lazy"]').forEach(function(img) {
      img.loading = 'eager';
    });
  }

  // Mode toggle
  (function() {
    var html = document.documentElement;
    document.querySelector('.mode-toggle').addEventListener('click', function() {
      var isDark = html.classList.contains('dark') ||
        (!html.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      html.classList.remove('dark', 'light');
      var next = isDark ? 'light' : 'dark';
      html.classList.add(next);
      try { localStorage.setItem('colorScheme', next); } catch (e) {}
    });
  })();

  /* Copy button: formatted citation. Nothing here is guarded, because nothing here can be
     absent: #live-msg is unconditional markup in both layouts, and a .cite-btn only exists
     inside publication.html's <article>, where the same `page.doi` conditional that emits
     the button emits publication-cite.html's .cite-data beside it. Wrapping either in a Liquid
     conditional now fails loudly at the click rather than silently doing nothing. */
  (function() {
    var liveMsg = document.getElementById('live-msg');
    document.querySelectorAll('.cite-btn').forEach(function(btn) {
      var label = btn.textContent;
      btn.addEventListener('click', function() {
        var data = btn.closest('article').querySelector('.cite-data');
        navigator.clipboard.writeText(data.textContent.trim()).then(function() {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          liveMsg.textContent = 'Citation copied to clipboard.';
          setTimeout(function() {
            btn.textContent = label;
            btn.classList.remove('copied');
            liveMsg.textContent = '';
          }, 1500);
        });
      });
    });
  })();
</script>
