{%- comment -%}
Stamps the stored color scheme on <html> before first paint, so the system palette never
flashes. Separate from site-head.html because 404.html needs this alone.
{%- endcomment -%}
<script>!function(){try{var c=localStorage.getItem('colorScheme');if(c)document.documentElement.classList.add(c)}catch(e){}}()</script>
